<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALUMINUM DAILY｜Peter 鋁金屬情報彙整</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: #f5f5f0;
    color: #222;
    min-height: 100vh;
  }

  .masthead {
    background: #1a1a1a;
    color: #fff;
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .masthead-title {
    font-family: Georgia, serif;
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: 4px;
  }
  .masthead-sub { font-size: 0.82rem; color: #ccc; margin-top: 2px; }
  .masthead-rule { height: 4px; background: linear-gradient(90deg, #b8860b, #ffd700, #b8860b); }

  .container { max-width: 860px; margin: 0 auto; padding: 32px 16px; }

  .stats-row {
    display: flex;
    gap: 12px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .stat-card {
    background: #fff;
    border-radius: 10px;
    padding: 16px 20px;
    flex: 1;
    min-width: 140px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    text-align: center;
  }
  .stat-card .num {
    font-size: 2rem;
    font-weight: 700;
    font-family: Georgia, serif;
    color: #1a3a5c;
  }
  .stat-card .lbl { font-size: 0.75rem; color: #888; margin-top: 4px; }

  .section-title {
    font-family: Georgia, serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: #1a3a5c;
    border-left: 5px solid #ffd700;
    padding-left: 12px;
    margin-bottom: 16px;
  }

  .report-list { list-style: none; }
  .report-item {
    background: #fff;
    border-radius: 10px;
    margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    overflow: hidden;
    display: flex;
    align-items: stretch;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .report-item:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.10);
  }
  .report-date-bar {
    width: 90px;
    flex-shrink: 0;
    background: linear-gradient(160deg, #1a3a5c, #0d2540);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 14px 8px;
    text-align: center;
  }
  .report-date-bar .month {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #ffd700;
  }
  .report-date-bar .day {
    font-size: 2rem;
    font-weight: 900;
    font-family: Georgia, serif;
    line-height: 1;
  }
  .report-date-bar .year { font-size: 0.68rem; color: #aac; }
  .report-date-bar .weekday { font-size: 0.65rem; color: #99b; margin-top: 2px; }

  .report-body {
    flex: 1;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .report-body .headline {
    font-size: 0.92rem;
    font-weight: 600;
    color: #222;
    line-height: 1.5;
    flex: 1;
    min-width: 200px;
  }
  .tag {
    display: inline-block;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
    margin-right: 6px;
    vertical-align: middle;
  }
  .tag-latest { background: #d32f2f; color: #fff; }
  .tag-normal { background: #e3f2fd; color: #0277bd; }

  .report-open-btn {
    display: inline-block;
    background: #1a3a5c;
    color: #fff;
    text-decoration: none;
    padding: 7px 16px;
    border-radius: 6px;
    font-size: 0.82rem;
    font-weight: 600;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .report-open-btn:hover { background: #0d2540; }

  footer {
    text-align: center;
    font-size: 0.75rem;
    color: #aaa;
    margin-top: 40px;
    padding-bottom: 20px;
  }
</style>
</head>
<body>

<div class="masthead">
  <div>
    <div class="masthead-title">ALUMINUM DAILY</div>
    <div class="masthead-sub">Peter 專屬鋁金屬情報｜歷史報告彙整</div>
  </div>
  <div style="font-size:0.82rem; color:#ccc; text-align:right;">
    全球鋁市行情 × 供需分析 × 航運動態
  </div>
</div>
<div class="masthead-rule"></div>

<div class="container">

  <div class="stats-row">
    <div class="stat-card">
      <div class="num" id="total-count">—</div>
      <div class="lbl">累積報告份數</div>
    </div>
    <div class="stat-card">
      <div class="num" id="latest-date">—</div>
      <div class="lbl">最新一份日期</div>
    </div>
    <div class="stat-card">
      <div class="num">每天</div>
      <div class="lbl">自動更新頻率</div>
    </div>
  </div>

  <div class="section-title">📰 報告列表</div>

  <ul class="report-list" id="report-list"></ul>

</div>

<footer>ALUMINUM DAILY · Peter 專屬情報 · 每個工作日自動產製</footer>

<script>
  // ── 報告清單（最新的放最前面）──────────────────────────────────
  const reports = [
    {
      date: "2026-08-17",
      weekday: "星期一",
      headline: "中東戰火重燃、GCC 鋁廠受損，LME 庫存觸 28 年新低，全球鋁價逼近 $3,300"
    },
    {
      date: "2026-08-17",
      weekday: "星期一",
      headline: "伊朗戰爭重創波灣鋁產能逾 210 萬噸，LME 庫存跌至 25 年新低 24.83 萬噸——供給緊繃格局難解"
    },
    {
      date: "2026-08-16",
      weekday: "星期日",
      headline: "LME 庫存創28年新低、基金淨多倉單週跳升至14萬口——鋁市多頭重燃，惟和平談判分歧制造不確定性"
    },
    {
      date: "2026-08-15",
      weekday: "星期六",
      headline: "LME 庫存跌破 25 萬噸關口——七年新低警示逼近，但近期回落考驗多頭支撐"
    },
    {
      date: "2026-08-14",
      weekday: "星期五",
      headline: "Alunorte 氧化鋁危機解除、荷姆茲仍在燃燒——鋁市空多交織，LME 庫存跌至本世紀新低"
    },
    {
      date: "2026-08-13",
      weekday: "星期四",
      headline: "中東戰火未息、美關稅壓力持續，LME 鋁現貨轉入逆價差——供應緊俏信號點亮"
    },
    {
      date: "2026-08-12",
      weekday: "星期三",
      headline: "LME 鋁庫存創近 30 年最低、Cash 逆價差確立，現貨緊俏疊加荷姆茲封鎖令供應鏈警報全面拉響"
    },
    {
      date: "2026-08-11",
      weekday: "星期二",
      headline: "中東烽火延燒：伊朗打穿 UAE 鋁廠，LME 庫存觸 28 年新低，鋁價逼近四年高峰"
    },
    {
      date: "2026-08-10",
      weekday: "星期一",
      headline: "荷姆茲封鎖進入第 41 天，GCC 8% 全球鋁產能陷斷鏈危機，LME 庫存跌至近 30 年新低，逆價差訊號支撐鋁價"
    },
    {
      date: "2026-08-08",
      weekday: "星期六",
      headline: "LME 庫存創本世紀新低 + Alcoa 澳洲氧化鋁減產 20-30 萬噸，供應面三重利空齊發，鋁價升至 $3,280/MT"
    },
    {
      date: "2026-08-07",
      weekday: "星期五",
      headline: "荷姆茲海峽實質封鎖 + 中國產能逼近上限雙重夾擊，LME 鋁創六週新高 $3,255/MT，現貨 Backwardation 確立"
    },
  ];
  // ────────────────────────────────────────────────────────────────

  const MONTH_ZH = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];

  function render() {
    const list = document.getElementById("report-list");
    if (!reports.length) { list.innerHTML = '<li style="padding:40px;text-align:center;color:#aaa;">尚無報告</li>'; return; }

    document.getElementById("total-count").textContent = reports.length;
    document.getElementById("latest-date").textContent = reports[0].date.slice(5).replace("-", "/");

    list.innerHTML = reports.map((r, i) => {
      const [yyyy, mm, dd] = r.date.split("-");
      const month = MONTH_ZH[parseInt(mm) - 1];
      const tag = i === 0
        ? '<span class="tag tag-latest">最新</span>'
        : `<span class="tag tag-normal">${month}</span>`;
      return `
        <li class="report-item">
          <div class="report-date-bar">
            <div class="month">${month}</div>
            <div class="day">${dd}</div>
            <div class="year">${yyyy}</div>
            <div class="weekday">${r.weekday}</div>
          </div>
          <div class="report-body">
            <div class="headline">${tag}${r.headline}</div>
            <a class="report-open-btn" href="aluminum-brief-${r.date}.html">開啟報告 →</a>
          </div>
        </li>`;
    }).join("");
  }

  render();
</script>
</body>
</html>
